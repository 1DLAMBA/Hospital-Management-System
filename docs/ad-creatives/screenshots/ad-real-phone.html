<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix - Real app screenshot ad B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .creative {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 20% 85%, rgba(48,120,235,0.45) 0%, rgba(48,120,235,0) 55%),
      linear-gradient(135deg, #0a1233 0%, #16214a 45%, #0e3d85 100%);
    color: #fff; font-family: 'IBM Plex Sans', sans-serif;
  }
  .logo { position: absolute; top: 72px; left: 76px; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; z-index: 5; }
  .copy { position: relative; z-index: 4; padding: 200px 90px 0; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; color: #93bdff;
             font-weight: 500; font-size: 24px; letter-spacing: 0.18em; margin-bottom: 26px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 88px; line-height: 1.08;
       letter-spacing: -0.01em; }
  .accent { color: #8fbaff; }
  .sub { margin-top: 34px; color: rgba(255,255,255,0.86); font-size: 36px; line-height: 1.42; max-width: 720px; }
  .shot { position: absolute; right: -40px; bottom: 300px; width: 620px; z-index: 2; }
  .shot img { width: 100%; display: block; filter: drop-shadow(0 30px 70px rgba(2,6,20,0.6)); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 90px 110px;
          display: flex; flex-direction: column; gap: 26px;
          background: linear-gradient(180deg, rgba(10,18,51,0) 0%, rgba(8,14,40,0.9) 60%, #081028 100%);
          padding-top: 260px; }
  .cta { align-self: flex-start; background: #fff; color: #14204a; font-weight: 700; font-size: 40px;
         border-radius: 999px; padding: 32px 70px; box-shadow: 0 10px 30px rgba(3,10,32,0.45); }
  .url { font-family: 'IBM Plex Mono', monospace; color: rgba(255,255,255,0.72); font-size: 26px; }
</style>
</head>
<body>
<div class="creative">
  <div class="logo">Phoenix.</div>
  <div class="copy">
    <div class="eyebrow">Real profile. Real screen.</div>
    <h1>Every doctor<br>is verified<br><span class="accent">before you book.</span></h1>
    <div class="sub">Credentials, specialty, and experience — right there before you confirm.</div>
  </div>
  <div class="shot">
    <img src="processed/hero-phone-only-feathered.png" alt="">
  </div>
  <div class="foot">
    <div class="cta">Book a consultation</div>
    <div class="url">phoenixmed.online</div>
  </div>
</div>
</body>
</html>
