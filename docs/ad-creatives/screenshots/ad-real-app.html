<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix - Real app screenshot ad A</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .creative {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 78% 14%, rgba(48,120,235,0.5) 0%, rgba(48,120,235,0) 56%),
      linear-gradient(135deg, #0a1233 0%, #16214a 45%, #0e3d85 100%);
    color: #fff; font-family: 'IBM Plex Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo { position: absolute; top: 72px; left: 76px; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; z-index: 5; }
  .copy { position: relative; z-index: 4; text-align: center; padding: 210px 90px 0; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; color: #93bdff;
             font-weight: 500; font-size: 24px; letter-spacing: 0.18em; margin-bottom: 26px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 84px; line-height: 1.08;
       letter-spacing: -0.01em; }
  .accent { color: #8fbaff; }
  .shot { position: relative; margin-top: 70px; width: 940px; }
  .shot img { width: 100%; display: block; filter: drop-shadow(0 30px 70px rgba(2,6,20,0.55)); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 90px 110px;
          display: flex; flex-direction: column; align-items: center; gap: 28px;
          background: linear-gradient(180deg, rgba(10,18,51,0) 0%, rgba(8,14,40,0.85) 55%, #081028 100%);
          padding-top: 220px; }
  .sub { color: rgba(255,255,255,0.86); font-size: 34px; line-height: 1.4; text-align: center; max-width: 820px; }
  .cta { background: #fff; color: #14204a; font-weight: 700; font-size: 40px;
         border-radius: 999px; padding: 32px 70px; box-shadow: 0 10px 30px rgba(3,10,32,0.45); }
  .url { font-family: 'IBM Plex Mono', monospace; color: rgba(255,255,255,0.72); font-size: 26px; }
</style>
</head>
<body>
<div class="creative">
  <div class="logo">Phoenix.</div>
  <div class="copy">
    <div class="eyebrow">No mockups</div>
    <h1>This is what<br>booking a doctor<br><span class="accent">actually looks like.</span></h1>
  </div>
  <div class="shot">
    <img src="processed/hero-device-mockup-feathered.png" alt="">
  </div>
  <div class="foot">
    <div class="sub">Describe your symptoms, get matched to a specialist, and chat with a real, verified doctor — from your phone.</div>
    <div class="cta">Book a consultation</div>
    <div class="url">phoenixmed.online</div>
  </div>
</div>
</body>
</html>
