<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0055aa; } a:hover { color: #003f80; }
  </style>
</helmet>

<!-- Second value-content shape: a numbered list. Carries no clinical claim at
     all - pure preparation advice - so it needs no medical review.
     Animation: the three items stagger in, tie-in last. -->
<div style="width: 1080px; height: 1920px; overflow: hidden; position: relative; box-sizing: border-box; padding: 190px 80px 250px; background: #f7f9fc; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 50px;">

  <div style="display: flex; flex-direction: column; gap: 46px;">
    <div style="font-size: 44px; font-weight: 700; color: #10193a; letter-spacing: -0.02em;" id="logo">Phoenix.</div>
    <div style="height: 4px; width: 120px; background: #0055aa; border-radius: 2px;" id="rule"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 42px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #0055aa;" id="eyebrow">Before your consultation</div>

    <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 94px; line-height: 1.08; color: #10193a; letter-spacing: -0.01em;" id="claim">Three things to<br><span style="color: #0055aa;">have ready.</span></h1>

    <div style="display: flex; flex-direction: column; gap: 26px;">
      <div style="display: flex; gap: 26px; align-items: flex-start;" id="item1">
        <div style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; color: #0055aa; background: #e7f0fa; border-radius: 10px; padding: 10px 16px;">01</div>
        <div style="font-size: 34px; line-height: 1.45; color: #10193a;">What you are feeling, and since when.</div>
      </div>
      <div style="display: flex; gap: 26px; align-items: flex-start;" id="item2">
        <div style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; color: #0055aa; background: #e7f0fa; border-radius: 10px; padding: 10px 16px;">02</div>
        <div style="font-size: 34px; line-height: 1.45; color: #10193a;">Any medication you are currently taking.</div>
      </div>
      <div style="display: flex; gap: 26px; align-items: flex-start;" id="item3">
        <div style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; color: #0055aa; background: #e7f0fa; border-radius: 10px; padding: 10px 16px;">03</div>
        <div style="font-size: 34px; line-height: 1.45; color: #10193a;">Results from any test you have done before.</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 26px;">
    <div style="height: 1px; background: #e3e8f0;" id="divider"></div>
    <p style="margin: 0; font-size: 30px; line-height: 1.5; color: #46507a;" id="tiein">On Phoenix these stay in your records, so the next doctor already has them.</p>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #737c9e;" id="url">phoenixmed.online</div>
  </div>

</div>
</x-dc>
</body>
</html>
