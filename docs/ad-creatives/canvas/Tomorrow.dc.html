<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8fbaff; } a:hover { color: #b9d4ff; }
  </style>
</helmet>

<!-- Animation note: each .strike bar is a separate element so it can wipe
     left-to-right in sequence, then the confirm row lands last. -->
<div style="width: 1080px; height: 1920px; overflow: hidden; position: relative; box-sizing: border-box; padding: 190px 80px 250px; background: linear-gradient(160deg, #0a1233 0%, #16214a 52%, #0e3d85 100%); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 46px;">

  <div style="font-size: 46px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;" id="logo">Phoenix.</div>

  <div style="display: flex; flex-direction: column; gap: 26px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #93bdff;" id="eyebrow">Online consultations</div>
    <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 98px; line-height: 1.06; color: #ffffff; letter-spacing: -0.01em;" id="headline">You won&#39;t hear<br><span style="color: #8fbaff;">these on Phoenix.</span></h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 26px;">

    <div style="position: relative; align-self: flex-start;" id="row1">
      <div style="font-size: 40px; color: rgba(255, 255, 255, 0.55); font-weight: 500;">&ldquo;Come back tomorrow.&rdquo;</div>
      <div style="position: absolute; left: 0; top: 50%; width: 100%; height: 3px; background: #ff8a8a; border-radius: 2px;" id="strike1"></div>
    </div>

    <div style="position: relative; align-self: flex-start;" id="row2">
      <div style="font-size: 40px; color: rgba(255, 255, 255, 0.55); font-weight: 500;">&ldquo;The doctor is not on seat.&rdquo;</div>
      <div style="position: absolute; left: 0; top: 50%; width: 100%; height: 3px; background: #ff8a8a; border-radius: 2px;" id="strike2"></div>
    </div>

    <div style="position: relative; align-self: flex-start;" id="row3">
      <div style="font-size: 40px; color: rgba(255, 255, 255, 0.55); font-weight: 500;">&ldquo;Nothing until next week.&rdquo;</div>
      <div style="position: absolute; left: 0; top: 50%; width: 100%; height: 3px; background: #ff8a8a; border-radius: 2px;" id="strike3"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 20px; margin-top: 14px; padding: 30px 34px; background: rgba(143, 186, 255, 0.14); border: 1px solid rgba(143, 186, 255, 0.4); border-radius: 22px; align-self: flex-start;" id="confirm">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8fbaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>
      <div style="font-size: 38px; font-weight: 600; color: #ffffff;">A time you picked yourself.</div>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 30px; align-items: flex-start;">
    <div style="padding: 32px 64px; background: #ffffff; color: #14204a; border-radius: 999px; font-size: 38px; font-weight: 700; box-shadow: 0 10px 30px rgba(3, 10, 32, 0.45);" id="cta">Book a consultation</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 27px; color: rgba(255, 255, 255, 0.72);" id="url">phoenixmed.online</div>
  </div>

</div>
</x-dc>
</body>
</html>
