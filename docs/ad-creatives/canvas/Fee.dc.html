<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8fbaff; } a:hover { color: #b9d4ff; }
  </style>
</helmet>

<!-- Animation note: the receipt rows are siblings in one flex column, so they
     can stagger in top-to-bottom and the total row can land last. -->
<div style="width: 1080px; height: 1920px; overflow: hidden; position: relative; box-sizing: border-box; padding: 190px 80px 250px; background: linear-gradient(160deg, #0a1233 0%, #16214a 52%, #0e3d85 100%); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 44px;">

  <div style="font-size: 46px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;" id="logo">Phoenix.</div>

  <div style="display: flex; flex-direction: column; gap: 26px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #93bdff;" id="eyebrow">No surprises</div>
    <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 104px; line-height: 1.05; color: #ffffff; letter-spacing: -0.01em;"><span style="display: block;" id="h1a">You see the fee</span><span style="display: block; color: #8fbaff;" id="h1b">before you book.</span></h1>
  </div>

  <div style="padding: 42px 38px; background: #ffffff; border-radius: 28px; display: flex; flex-direction: column; gap: 24px;" id="receipt">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px;" id="fee1">
      <div style="font-size: 32px; color: #46507a;">Consultation</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 500; color: #10193a;">&#8358;[YOUR FEE]</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px;" id="fee2">
      <div style="font-size: 32px; color: #46507a;">Booking charge</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 500; color: #0f766e;">&#8358;0</div>
    </div>
    <div style="height: 1px; background: #e3e8f0;" id="rule"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px;" id="fee3">
      <div style="font-size: 34px; font-weight: 600; color: #10193a;">What you pay</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 600; color: #10193a;">&#8358;[YOUR FEE]</div>
    </div>
    <div style="font-size: 26px; line-height: 1.45; color: #737c9e;" id="feeNote">Shown to you in full before you confirm. Nothing added at the end.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; align-items: flex-start;">
    <div style="padding: 32px 64px; background: #ffffff; color: #14204a; border-radius: 999px; font-size: 38px; font-weight: 700; box-shadow: 0 10px 30px rgba(3, 10, 32, 0.45);" id="cta">Book a consultation</div>
    <div style="font-size: 28px; color: rgba(255, 255, 255, 0.78);" id="freeLine">Creating an account is free.</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 27px; color: rgba(255, 255, 255, 0.72);" id="url">phoenixmed.online</div>
  </div>

</div>
</x-dc>
</body>
</html>
