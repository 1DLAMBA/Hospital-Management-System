<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8fbaff; } a:hover { color: #b9d4ff; }
  </style>
</helmet>

<div style="width: 1080px; height: 1920px; overflow: hidden; position: relative; box-sizing: border-box; background: #0a1233; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- The old way: drained of colour on purpose -->
  <div style="flex-grow: 1; box-sizing: border-box; padding: 200px 80px 60px; background: #151a2e; display: flex; flex-direction: column; gap: 34px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #737c9e;">Booking a doctor, the old way</div>
    <div style="display: flex; align-items: baseline; gap: 22px;">
      <div style="font-family: 'EB Garamond', Georgia, serif; font-size: 150px; font-weight: 600; line-height: 1; color: #737c9e;">3 hrs</div>
      <div style="font-size: 30px; color: #737c9e;">of your morning</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 8px;">
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #8d95b5;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5a6285" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
        <span>Call the clinic. Hold.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #8d95b5;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5a6285" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
        <span>Nothing free until next week.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #8d95b5;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5a6285" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
        <span>Call back tomorrow.</span>
      </div>
    </div>
  </div>

  <!-- With Phoenix: colour returns -->
  <div style="flex-grow: 1; box-sizing: border-box; padding: 70px 80px 250px; background: linear-gradient(160deg, #10306e 0%, #0e3d85 100%); display: flex; flex-direction: column; gap: 34px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #93bdff;">With Phoenix</div>
    <div style="display: flex; align-items: baseline; gap: 22px;">
      <div style="font-family: 'EB Garamond', Georgia, serif; font-size: 150px; font-weight: 600; line-height: 1; color: #ffffff;">4 min</div>
      <div style="font-size: 30px; color: rgba(255, 255, 255, 0.82);">on your phone</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 8px;">
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #ffffff;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8fbaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>
        <span>Say what&#39;s going on.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #ffffff;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8fbaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>
        <span>Pick a doctor who&#39;s free.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 30px; color: #ffffff;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8fbaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>
        <span>Consult by secure chat.</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 26px; align-items: flex-start; margin-top: 22px;">
      <div style="padding: 32px 64px; background: #ffffff; color: #14204a; border-radius: 999px; font-size: 38px; font-weight: 700; box-shadow: 0 10px 30px rgba(3, 10, 32, 0.45);">Book a consultation</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 27px; color: rgba(255, 255, 255, 0.72);">phoenixmed.online</div>
    </div>
  </div>

  <div style="position: absolute; top: 96px; left: 80px; font-size: 42px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">Phoenix.</div>

</div>
</x-dc>
</body>
</html>
