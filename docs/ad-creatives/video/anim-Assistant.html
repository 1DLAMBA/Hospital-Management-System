<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix - Assistant</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8fbaff; } a:hover { color: #b9d4ff; }
  </style>

<style>
  html, body { width: 1080px; height: 1920px; overflow: hidden; margin: 0; background: #060d26; }
</style>
</head>
<body>
<!-- Animation note: the specialty chips are built to light up one at a time
     and settle on #chipPick - a scanning beat, then a decision. -->
<div style="width: 1080px; height: 1920px; overflow: hidden; position: relative; box-sizing: border-box; padding: 190px 80px 250px; background: linear-gradient(160deg, #0a1233 0%, #16214a 52%, #0e3d85 100%); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 44px;">

  <div style="font-size: 46px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;" id="logo">Phoenix.</div>

  <div style="display: flex; flex-direction: column; gap: 26px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #93bdff;" id="eyebrow">Your assistant</div>
    <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 104px; line-height: 1.05; color: #ffffff; letter-spacing: -0.01em;"><span style="display: block;" id="h1a">Not sure which</span><span style="display: block; color: #8fbaff;" id="h1b">doctor you need?</span></h1>
    <p style="margin: 8px 0 0; font-size: 33px; line-height: 1.5; color: rgba(255, 255, 255, 0.82); max-width: 800px;" id="sub">Describe what&#39;s going on. Your assistant points you to the right specialist, then you pick a time.</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 18px;" id="chips">
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); font-size: 30px; color: rgba(255, 255, 255, 0.6);" id="chip1">Paediatrics</div>
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); font-size: 30px; color: rgba(255, 255, 255, 0.6);" id="chip2">Dermatology</div>
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid #8fbaff; background: #8fbaff; font-size: 30px; font-weight: 600; color: #10193a;" id="chipPick">General Medicine</div>
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); font-size: 30px; color: rgba(255, 255, 255, 0.6);" id="chip3">Cardiology</div>
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); font-size: 30px; color: rgba(255, 255, 255, 0.6);" id="chip4">Physiotherapy</div>
    <div style="padding: 22px 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); font-size: 30px; color: rgba(255, 255, 255, 0.6);" id="chip5">Nutrition</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 30px; align-items: flex-start;">
    <div style="padding: 32px 64px; background: #ffffff; color: #14204a; border-radius: 999px; font-size: 38px; font-weight: 700; box-shadow: 0 10px 30px rgba(3, 10, 32, 0.45);" id="cta">Book a consultation</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 27px; color: rgba(255, 255, 255, 0.72);" id="url">phoenixmed.online</div>
  </div>

</div>
<script>
function initTimeline(spec) {
  var easeOut  = function (p) { return 1 - Math.pow(1 - p, 3); };
  var easeBack = function (p) { var c = 2.2; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  var clamp    = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  function cue(t, a, b) { return clamp((t - a) / (b - a)); }

  // Styles that must differ from the static artboard (e.g. a chip that starts
  // un-selected so it can lock in later).
  (spec.init || []).forEach(function (i) {
    var e = document.getElementById(i.id);
    if (e) { for (var k in i.style) e.style[k] = i.style[k]; }
  });

  // Prepare any wave group for a draw-on.
  var waveSets = {};
  (spec.cues || []).filter(function (c) { return c.type === 'waves'; }).forEach(function (c) {
    var g = document.getElementById(c.id);
    if (!g) return;
    var paths = Array.prototype.slice.call(g.querySelectorAll('path'));
    paths.forEach(function (p) {
      var L = p.getTotalLength();
      p.setAttribute('stroke-dasharray', L);
      p.setAttribute('stroke-dashoffset', L);
      p.__len = L;
    });
    waveSets[c.id] = paths;
    g.style.opacity = 0;
  });

  var el = {};
  (spec.cues || []).forEach(function (c) { el[c.id] = el[c.id] || document.getElementById(c.id); });
  (spec.cues || []).forEach(function (c) {
    var e = el[c.id];
    if (e && c.type !== 'waves') { e.style.opacity = 0; e.style.willChange = 'opacity, transform'; }
  });

  window.renderFrame = function (t) {
    (spec.cues || []).forEach(function (c) {
      var e = el[c.id];
      if (!e) return;
      var p = easeOut(cue(t, c.a, c.b));

      if (c.type === 'rise') {
        e.style.opacity = p;
        e.style.transform = 'translateY(' + (1 - p) * (c.d || 28) + 'px)';

      } else if (c.type === 'slide') {
        e.style.opacity = p;
        e.style.transform = 'translateX(' + (1 - p) * (c.d || -30) + 'px)';

      } else if (c.type === 'fade') {
        e.style.opacity = p;

      } else if (c.type === 'pop') {
        var raw = cue(t, c.a, c.b);
        e.style.opacity = p;
        e.style.transform = 'scale(' + (raw > 0 ? easeBack(raw) : 0.6) + ')';

      } else if (c.type === 'waves') {
        e.style.opacity = p * (c.max || 0.5);
        var draw = easeOut(cue(t, c.a, c.b));
        (waveSets[c.id] || []).forEach(function (path) {
          path.setAttribute('stroke-dashoffset', String(path.__len * (1 - draw)));
        });

      } else if (c.type === 'lock') {
        // Enters dim with its siblings, then locks in with a bounce at c.a.
        var ip = easeOut(cue(t, c.ia, c.ib));
        var lp = cue(t, c.a, c.b);
        e.style.opacity = ip;
        var bounce = lp > 0 ? 1 + 0.10 * Math.sin(easeOut(lp) * Math.PI) : 1;
        e.style.transform = 'translateY(' + (1 - ip) * 20 + 'px) scale(' + bounce + ')';
        if (lp > 0.28) { for (var k in c.to) e.style[k] = c.to[k]; }
        else { for (var k2 in c.from) e.style[k2] = c.from[k2]; }
      }
    });
  };
  window.renderFrame(0);
}
</script>
<script>initTimeline({"init": [{"id": "chipPick", "style": {"border": "1px solid rgba(255,255,255,0.22)", "background": "rgba(255,255,255,0.06)", "color": "rgba(255,255,255,0.6)", "fontWeight": "400"}}], "cues": [{"id": "eyebrow", "type": "rise", "a": 0.5, "b": 1.0, "d": 18}, {"id": "h1a", "type": "rise", "a": 0.75, "b": 1.45, "d": 44}, {"id": "h1b", "type": "rise", "a": 1.1, "b": 1.8, "d": 44}, {"id": "sub", "type": "rise", "a": 1.7, "b": 2.3, "d": 24}, {"id": "chip1", "type": "rise", "a": 2.45, "b": 2.8, "d": 20}, {"id": "chip2", "type": "rise", "a": 2.6, "b": 2.95, "d": 20}, {"id": "chip3", "type": "rise", "a": 2.9, "b": 3.25, "d": 20}, {"id": "chip4", "type": "rise", "a": 3.05, "b": 3.4, "d": 20}, {"id": "chip5", "type": "rise", "a": 3.2, "b": 3.55, "d": 20}, {"id": "chipPick", "type": "lock", "ia": 2.75, "ib": 3.1, "a": 3.85, "b": 4.45, "from": {"border": "1px solid rgba(255,255,255,0.22)", "background": "rgba(255,255,255,0.06)", "color": "rgba(255,255,255,0.6)", "fontWeight": "400"}, "to": {"border": "1px solid #8fbaff", "background": "#8fbaff", "color": "#10193a", "fontWeight": "600"}}, {"id": "cta", "type": "rise", "a": 4.85, "b": 5.45, "d": 28}, {"id": "url", "type": "rise", "a": 5.25, "b": 5.8, "d": 16}]});</script>
</body>
</html>
