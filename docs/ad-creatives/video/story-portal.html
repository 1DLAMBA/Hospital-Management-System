<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix - The phone as a portal (concept)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070f; }
  .stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
  svg { position: absolute; inset: 0; display: block; }
  .wordmark {
    position: absolute; left: 0; right: 0; bottom: 120px; text-align: center;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 700;
    font-size: 42px; letter-spacing: -0.01em; color: #eaf1ff;
    opacity: 0; will-change: opacity, transform;
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="roomGrad" cx="46%" cy="38%" r="75%">
        <stop offset="0%" stop-color="#1a2440"/>
        <stop offset="55%" stop-color="#0d1426"/>
        <stop offset="100%" stop-color="#05070f"/>
      </radialGradient>
      <radialGradient id="lampGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffcf94" stop-opacity="0.65"/>
        <stop offset="45%" stop-color="#e8a463" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#e8a463" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8fbaff" stop-opacity="0.55"/>
        <stop offset="55%" stop-color="#5f8fe0" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#5f8fe0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="portalGrad" cx="50%" cy="38%" r="75%">
        <stop offset="0%" stop-color="#f4f9ff"/>
        <stop offset="50%" stop-color="#bfdcff"/>
        <stop offset="100%" stop-color="#6fa0e6"/>
      </radialGradient>
      <linearGradient id="handGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8a5a3a"/>
        <stop offset="100%" stop-color="#5c3620"/>
      </linearGradient>
      <filter id="blurSoft" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="26"/>
      </filter>
      <filter id="blurWide" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="55"/>
      </filter>
    </defs>

    <rect x="0" y="0" width="1080" height="1920" fill="url(#roomGrad)"/>

    <g opacity="0.55">
      <line x1="58" y1="0" x2="58" y2="520" stroke="#0a1120" stroke-width="7"/>
      <line x1="30" y1="150" x2="86" y2="110" stroke="#0a1120" stroke-width="5"/>
      <line x1="30" y1="210" x2="86" y2="170" stroke="#0a1120" stroke-width="5"/>
    </g>

    <g>
      <rect x="80" y="150" width="280" height="360" rx="10" fill="#0a1120"/>
      <rect x="100" y="170" width="240" height="320" rx="4" fill="#233457" opacity="0.85"/>
      <rect x="100" y="170" width="240" height="320" rx="4" fill="#3a5488" opacity="0.18"/>
      <line x1="220" y1="170" x2="220" y2="490" stroke="#0a1120" stroke-width="9"/>
      <line x1="100" y1="330" x2="340" y2="330" stroke="#0a1120" stroke-width="9"/>
    </g>

    <path d="M0,1660 Q270,1600 540,1650 T1080,1640 L1080,1920 L0,1920 Z" fill="#060912"/>

    <circle id="lampGlow" cx="175" cy="1555" r="170" fill="url(#lampGrad)" filter="url(#blurSoft)" opacity="0.5"/>
    <rect x="140" y="1518" width="70" height="112" rx="30" fill="#241c14"/>
    <circle cx="175" cy="1532" r="15" fill="#ffd9a0"/>

    <g id="phoneGroup">
      <g id="portalBleedG" opacity="0" style="transform-origin: 540px 1020px;">
        <ellipse cx="540" cy="1020" rx="360" ry="420" fill="url(#glowGrad)" filter="url(#blurWide)"/>
      </g>

      <rect x="430" y="760" width="220" height="460" rx="34" fill="#0d1220" stroke="#1c2740" stroke-width="4"/>
      <rect id="portalScreen" x="448" y="786" width="184" height="380" rx="22" fill="url(#portalGrad)" opacity="0"/>

      <g id="clinicHint" opacity="0">
        <rect x="505" y="826" width="70" height="14" rx="7" fill="#3a5a8a"/>
        <g stroke="#3a5a8a" stroke-width="6" stroke-linecap="round">
          <line x1="540" y1="868" x2="540" y2="892"/>
          <line x1="528" y1="880" x2="552" y2="880"/>
        </g>
      </g>

      <rect x="452" y="1120" width="30" height="170" rx="15" fill="url(#handGrad)"/>
      <rect x="494" y="1120" width="30" height="178" rx="15" fill="url(#handGrad)"/>
      <rect x="536" y="1120" width="30" height="178" rx="15" fill="url(#handGrad)"/>
      <rect x="578" y="1120" width="30" height="168" rx="15" fill="url(#handGrad)"/>
      <rect x="460" y="1258" width="180" height="140" rx="50" fill="url(#handGrad)"/>
      <rect x="626" y="985" width="52" height="140" rx="26" fill="url(#handGrad)" transform="rotate(-12 652 1055)"/>
    </g>
  </svg>

  <div class="wordmark" id="wordmark">Phoenix.</div>
</div>

<script>
(function () {
  var easeOut = function (p) { return 1 - Math.pow(1 - p, 3); };
  var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  function cue(t, a, b) { return clamp01((t - a) / (b - a)); }

  var lampGlow = document.getElementById('lampGlow');
  var portalScreen = document.getElementById('portalScreen');
  var portalBleedG = document.getElementById('portalBleedG');
  var clinicHint = document.getElementById('clinicHint');
  var phoneGroup = document.getElementById('phoneGroup');
  var wordmark = document.getElementById('wordmark');

  window.renderFrame = function (t) {
    lampGlow.setAttribute('opacity', (0.42 + 0.14 * Math.sin(t * 1.3)).toFixed(3));

    var screenP = easeOut(cue(t, 0.40, 1.60));
    portalScreen.setAttribute('opacity', screenP);

    var bleedP = easeOut(cue(t, 0.90, 2.10));
    portalBleedG.setAttribute('opacity', (bleedP * 0.85).toFixed(3));
    portalBleedG.style.transform = 'scale(' + (0.85 + 0.15 * bleedP) + ')';

    var hintP = easeOut(cue(t, 1.70, 2.50));
    clinicHint.setAttribute('opacity', hintP);

    var bob = Math.sin(t * 0.8) * 6;
    phoneGroup.style.transform = 'translateY(' + bob.toFixed(2) + 'px)';

    var wordP = easeOut(cue(t, 3.20, 4.00));
    wordmark.style.opacity = wordP;
    wordmark.style.transform = 'translateY(' + (1 - wordP) * 14 + 'px)';
  };
  window.renderFrame(0);
})();
</script>
</body>
</html>
