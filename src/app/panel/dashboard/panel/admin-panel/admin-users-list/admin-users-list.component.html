<section class="ph-page">
    <div class="ph-page-head">
        <div>
            <h1>Users</h1>
            <p>Everyone with a Phoenix account &mdash; patients and health professionals.</p>
        </div>
        <span class="search">
            <i class="pi pi-search" aria-hidden="true"></i>
            <input
                pInputText
                type="text"
                (input)="dt1.filterGlobal($any($event.target).value, 'contains')"
                placeholder="Search name, email, phone or role"
                aria-label="Search users" />
        </span>
    </div>

    <div class="ph-card table-card">
        <p-table
            #dt1
            [value]="users"
            dataKey="id"
            [rows]="10"
            [rowsPerPageOptions]="[10, 25, 50]"
            [paginator]="true"
            [loading]="loading"
            [globalFilterFields]="['name', 'email', 'phoneno', 'user_type']"
            styleClass="ph-table">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr>
                    <td>
                        <div class="person">
                            <img class="avatar" *ngIf="user.passport" [src]="avatar_file + user.passport" alt="" />
                            <span class="avatar avatar-fallback" *ngIf="!user.passport" aria-hidden="true">
                                {{ (user.name || '?').charAt(0) }}
                            </span>
                            <span class="name">{{ user.name }}</span>
                        </div>
                    </td>
                    <td><span class="role">{{ roleLabel(user) }}</span></td>
                    <td class="ph-record">{{ user.email }}</td>
                    <td class="ph-record">{{ user.phoneno }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4">
                        <div class="empty">
                            <strong>No matches</strong>
                            <span>Try a different name, email, phone number or role.</span>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</section>
