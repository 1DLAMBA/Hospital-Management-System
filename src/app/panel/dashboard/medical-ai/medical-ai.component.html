<div
  class="medical-ai-container medical-ai-container--glass"
  [class.medical-ai-container--idle]="messages.length === 1 && !isLoading">
  <div class="chat-toolbar">
    <p class="chat-hint">General health guidance — not a diagnosis.</p>
    <button
      type="button"
      class="clear-btn"
      (click)="clearConversation()"
      aria-label="Clear conversation"
      title="Clear conversation">
      <i class="pi pi-trash"></i>
    </button>
  </div>

  <div class="chat-container">
    <div class="messages" #messageContainer>
      <div *ngFor="let message of messages"
           [class]="'message ' + (message.type === 'user' ? 'user-message' : 'ai-message')">
        <div class="message-icon">
          <i [class]="message.type === 'user' ? 'pi pi-user' : 'pi pi-robot'"></i>
        </div>
        <div class="message-content">
          <div class="message-text">{{ message.content }}</div>
          <div class="message-time">{{ message.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
      <div *ngIf="isLoading" class="loading-indicator">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-wrapper">
        <textarea pInputTextarea
                  [(ngModel)]="userInput"
                  (keydown.enter)="onEnter($event)"
                  [rows]="1"
                  [autoResize]="true"
                  placeholder="Ask a health question..."
                  class="message-input"></textarea>
        <button
          type="button"
          class="send-button"
          (click)="sendMessage()"
          aria-label="Send message">
          <i class="bi bi-send"></i>
        </button>
      </div>
      <div class="suggestions" *ngIf="messages.length === 1">
        <p class="suggestions-label">Try asking:</p>
        <div class="suggestion-buttons">
          <button type="button" class="suggestion-chip"
                  (click)="userInput = 'What are common symptoms of flu?'; sendMessage()">
            Flu symptoms
          </button>
          <button type="button" class="suggestion-chip"
                  (click)="userInput = 'What are some healthy diet tips?'; sendMessage()">
            Diet tips
          </button>
          <button type="button" class="suggestion-chip"
                  (click)="userInput = 'What are some good exercise recommendations?'; sendMessage()">
            Exercise
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
