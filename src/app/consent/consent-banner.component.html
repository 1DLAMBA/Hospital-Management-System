<div class="consent" role="region" aria-label="Cookie consent" *ngIf="visible">
  <div class="consent-body">
    <p class="consent-text">
      We use cookies to measure how people find Phoenix and to improve our ads.
      Your health information is never used for advertising. See our
      <a routerLink="/privacy-policy">privacy policy</a>.
    </p>
    <div class="consent-actions">
      <button type="button" class="consent-btn consent-btn-ghost" (click)="decline()">
        Decline
      </button>
      <button type="button" class="consent-btn consent-btn-primary" (click)="accept()">
        Accept
      </button>
    </div>
  </div>
</div>
