<p-toast></p-toast>

<div class="verify-wrap">
  <div class="verify-card">
    <div class="verify-icon">
      <i class="pi pi-envelope"></i>
    </div>

    <h2 class="verify-title">Check your email</h2>

    <p class="verify-text">
      We've sent a verification link to
      <strong>{{ userEmail || 'your email address' }}</strong>.
      Open it and tap <strong>“Verify my email”</strong> to activate your account.
    </p>

    <p class="verify-subtext">
      The link expires in 60 minutes. Don't forget to check your spam folder.
    </p>

    <button
      type="button"
      pButton
      class="resend-btn"
      icon="pi pi-refresh"
      [label]="isResending ? 'Sending…' : (resent ? 'Resend link again' : 'Resend link')"
      [loading]="isResending"
      [disabled]="isResending"
      (click)="resendLink()">
    </button>

    <p class="verify-help">
      Wrong address? <a routerLink="/register">Sign up again</a> ·
      Already verified? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
